name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # Die HACS-Pruefung funktioniert nur bei oeffentlichen Repositories.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  python:
    name: Ruff und pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Installation
        run: pip install ruff pytest pyyaml jinja2 homeassistant paho-mqtt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: pytest
        run: pytest -q

  audit:
    name: Abhaengigkeiten pruefen (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r <(python3 -c 'import json;print("\n".join(json.load(open("custom_components/resqio/manifest.json"))["requirements"]))')
